        title: "Repair The Signatures Of A Release Download Capstone"
        path: sections/section-020/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: blob-signing
        task_kind: troubleshooting
        tags: [sign-blob, verify-blob, bundle, sbom, checksums, key-pair]
        learning_goals:
          - Find which bundles fail and why with cosign verify-blob
          - Rebuild the checksum file and sign every release file with the release key
          - Prove every file verifies without changing the archive or the SBOM
        resources:
          - name: "Verifying signatures"
            url: https://docs.sigstore.dev/cosign/verifying/verify/
          - name: "cosign verify-blob reference (v3.1.4)"
            url: https://github.com/sigstore/cosign/blob/v3.1.4/doc/cosign_verify-blob.md

  - id: module-030
    title: "Attestations And Policies"
