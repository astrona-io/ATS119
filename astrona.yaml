# Course manifest for ATS119 - Cosign Container & Blob Artifact Signing (Sigstore).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS119
  title: "Sigstore: Cosign Container & Blob Artifact Signing"
  maturity: draft
  description: >
    Training material covering the Cosign Container & Blob Artifact Signing
    domain of the Sigstore training path: key pairs and signing container
    images by digest, where cosign v3 stores signatures, annotations and
    verification, signing files and SBOMs with Sigstore bundles, in-toto
    attestations with SLSA provenance and vulnerability scan results, policies
    on attestation content, and managing signing keys: passwords, imported
    keys, keys in a key management service and key rotation. Each module pairs
    a layered reader with an ungraded hands-on playground and a graded
    practice lab. Each section closes with an integration capstone.
    Written for cosign v3.1.4.

  certification:
    name: Sigstore
    code: SIGSTORE
    provider: Astrona
    domain: Cosign Container & Blob Artifact Signing
    weight: 20

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Signing And Verifying Container Images"
    description: >
      Key pairs, signing a container image by its digest, where cosign v3
      stores the signature in the registry, annotations, and verifying a
      signature with a public key.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Sign And Verify Container Images With A Key Pair"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Key Pairs And Signing An Image By Digest"
        path: sections/section-010/module-01/course-01-key-pairs-and-signing-by-digest.md
      - type: reading
        title: "Where The Signature Lives In The Registry"
        path: sections/section-010/module-01/course-02-where-signatures-live.md
      - type: reading
        title: "Verifying Signatures And Annotations"
        path: sections/section-010/module-01/course-03-verifying-signatures-and-annotations.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Sign The Release Digest With Annotations Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 15m
        topic: image-signing
        task_kind: build
        tags: [cosign, key-pair, cosign-sign, cosign-verify, digest, annotations, offline-signing]
        learning_goals:
          - Resolve a tag to its digest and sign that digest with the release key
          - Add annotations to the signed payload and check them with cosign verify
          - Prove that only the release digest carries a release signature
        resources:
          - name: "Signing containers"
            url: https://docs.sigstore.dev/cosign/signing/signing_with_containers/
          - name: "Verifying signatures"
            url: https://docs.sigstore.dev/cosign/verifying/verify/
          - name: "cosign sign reference (v3.1.4)"
            url: https://github.com/sigstore/cosign/blob/v3.1.4/doc/cosign_sign.md
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair The Signature Of A Release Channel Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: image-signing
        task_kind: troubleshooting
        tags: [cosign-sign, cosign-verify, digest, annotations, key-pair, cosign-tree]
        learning_goals:
          - Find out which key signed a digest by verifying with each public key
          - Point a channel tag at the release digest and sign that digest with the release key
          - Prove the channel verifies while the old release stays unsigned by the release key
        resources:
          - name: "Verifying signatures"
            url: https://docs.sigstore.dev/cosign/verifying/verify/
          - name: "cosign verify reference (v3.1.4)"
            url: https://github.com/sigstore/cosign/blob/v3.1.4/doc/cosign_verify.md

