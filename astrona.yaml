        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "Sign A Release Archive And Its SBOM Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: blob-signing
        task_kind: build
        tags: [sign-blob, verify-blob, bundle, sbom, spdx, syft]
        learning_goals:
          - Generate an SPDX JSON SBOM for the release image with syft
          - Sign the release archive and the SBOM with the release key into bundles
          - Prove that a changed copy of the archive no longer verifies
        resources:
          - name: "Signing blobs"
            url: https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
