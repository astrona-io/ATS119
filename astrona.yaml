        task_kind: troubleshooting
        tags: [verify-attestation, rego-policy, vuln-attestation, slsa-provenance, cosign-clean, cosign-attest]
        learning_goals:
          - Write Rego policies that reject critical vulnerabilities and an untrusted builder
          - Replace stale attestations on the release digest so every attestation passes
          - Prove the policies pass the release and reject the old release
        resources:
