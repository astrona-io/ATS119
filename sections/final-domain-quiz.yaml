# Final domain knowledge check across all sections, including the in-depth modules.
schema_version: 1
kind: question_bank
id: ats119-final
course_id: ATS119
exam_code: SIGSTORE
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: cosign-artifact-signing
  title: Cosign Container & Blob Artifact Signing
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
- id: ats119-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Choose what to sign
  source_readings:
  - sections/section-010/module-01/course-01-key-pairs-and-signing-by-digest.md
  prompt: Why does the module sign `$REPO@$DIGEST` and not `$REPO:6.15.0`?
  options:
  - id: a
    text: A digest is encrypted and a tag is not.
    explanation: Not correct. A digest is a SHA-256 hash, not an encrypted value.
  - id: b
    text: A tag can be moved to another image, but a digest names one exact image.
    explanation: Correct. The signature then covers exactly the image that was checked.
  - id: c
    text: cosign refuses to sign any tag.
    explanation: Not correct. cosign signs a tag, resolves it and warns.
  - id: d
    text: A digest makes the image smaller in the registry.
    explanation: Not correct. The digest does not change the image size.
  correct_option: b
  explanation: Correct. The signature then covers exactly the image that was checked.
- id: ats119-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Find signatures in a registry
  source_readings:
  - sections/section-010/module-01/course-02-where-signatures-live.md
  prompt: "`regctl tag ls` shows no `.sig` tag for a digest that was signed with cosign
    v3. What does this mean?"
  options:
  - id: a
    text: Nothing yet. cosign v3 stores bundles as referrers, so check with `cosign
      tree` or `regctl artifact list`.
    explanation: Correct. The `.sig` tag is the older layout.
  - id: b
    text: The image is unsigned.
    explanation: Not correct. A v3 signature is a referrer and has no `.sig` tag.
  - id: c
    text: The registry deleted the signature.
    explanation: Not correct. Nothing says it was deleted.
  - id: d
    text: The signature was made with the wrong key.
    explanation: Not correct. The key does not decide which tags exist.
  correct_option: a
  explanation: Correct. The `.sig` tag is the older layout.
- id: ats119-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Use annotations as a filter
  source_readings:
  - sections/section-010/module-01/course-03-verifying-signatures-and-annotations.md
  prompt: An image has one signature without annotations. `cosign verify` runs without
    `-a`. What happens?
  options:
  - id: a
    text: It passes, because any valid signature from the key is enough.
    explanation: Correct. `-a` is a filter that is only applied when you give it.
  - id: b
    text: It fails, because the signature has no annotations.
    explanation: Not correct. Without `-a` there is no annotation condition.
  - id: c
    text: It fails, because annotations are always required.
    explanation: Not correct. They are required only when you ask with `-a`.
  - id: d
    text: It asks for a password.
    explanation: Not correct. Verification uses the public key only.
  correct_option: a
  explanation: Correct. `-a` is a filter that is only applied when you give it.
- id: ats119-final-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Sign a file
  source_readings:
  - sections/section-020/module-01/course-01-signing-a-file-with-a-bundle.md
  prompt: Which command signs a file of any kind and writes the result to a bundle?
  options:
  - id: a
    text: "`cosign sign <file>`"
    explanation: Not correct. `cosign sign` signs an image in a registry.
  - id: b
    text: "`cosign sign-blob --bundle <file>.sigstore.json <file>` with a key."
    explanation: Correct. It hashes the file, signs the hash and writes the bundle.
  - id: c
    text: "`cosign attest --bundle <file>`"
    explanation: Not correct. `cosign attest` attaches a signed statement to an image.
  - id: d
    text: "`cosign verify-blob --bundle <file>`"
    explanation: Not correct. That command checks a bundle. It does not create one.
  correct_option: b
  explanation: Correct. It hashes the file, signs the hash and writes the bundle.
- id: ats119-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Trust the public key
  source_readings:
  - sections/section-020/module-01/course-01-signing-a-file-with-a-bundle.md
  prompt: The bundle contains only a hint about the key. Why does a verifier need
    its own copy of the public key?
  options:
  - id: a
    text: If the bundle carried its own key, anyone could sign anything and the check
      would pass.
    explanation: Correct. The verifier must get the key from a trusted place.
  - id: b
    text: Because the bundle is encrypted.
    explanation: Not correct. The bundle is plain JSON.
  - id: c
    text: Because the hint is always wrong.
    explanation: Not correct. The hint helps pick the key. It cannot prove trust.
  - id: d
    text: Because cosign cannot read JSON.
    explanation: Not correct. cosign reads the bundle.
  correct_option: a
  explanation: Correct. The verifier must get the key from a trusted place.
- id: ats119-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Scan the digest
  source_readings:
  - sections/section-020/module-01/course-02-generating-and-signing-an-sbom.md
  prompt: Why does the module scan the image digest and not the tag?
  options:
  - id: a
    text: syft cannot read tags.
    explanation: Not correct. The reason is accuracy, not a syft limit.
  - id: b
    text: The SBOM then describes exactly the image that is signed, even if the tag
      moves.
    explanation: Correct. A tag could point at a different image later.
  - id: c
    text: A digest scan is faster.
    explanation: Not correct. Speed is not the reason.
  - id: d
    text: Tags are not allowed in SPDX.
    explanation: Not correct. SPDX does not forbid tags.
  correct_option: b
  explanation: Correct. A tag could point at a different image later.
- id: ats119-final-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Know who fills the subject
  source_readings:
  - sections/section-030/module-01/course-01-in-toto-statements-and-predicate-types.md
  prompt: Who puts the image digest into the `subject` of the statement when you run
    `cosign attest`?
  options:
  - id: a
    text: You do, inside the predicate file.
    explanation: Not correct. cosign builds the subject.
  - id: b
    text: The registry, when it stores the attestation.
    explanation: Not correct. The registry stores what cosign pushes.
  - id: c
    text: The scanner, when it writes the report.
    explanation: Not correct. The scanner does not know the attested image reference.
  - id: d
    text: cosign does, from the image reference you give.
    explanation: Correct. The predicate file holds only the predicate.
  correct_option: d
  explanation: Correct. The predicate file holds only the predicate.
- id: ats119-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the Rego contract
  source_readings:
  - sections/section-030/module-01/course-03-checking-attestations-with-a-policy.md
  prompt: Which package name and rule does cosign v3.1.4 evaluate in a Rego policy?
  options:
  - id: a
    text: "`package policy` and the rule `deny`"
    explanation: Not correct. cosign asks for `data.signature.allow`.
  - id: b
    text: "`package signature` and the rule `allow`"
    explanation: Correct. The input is the verified in-toto statement.
  - id: c
    text: "`package cosign` and the rule `verify`"
    explanation: Not correct. These names are not used.
  - id: d
    text: "`package main` and the rule `result`"
    explanation: Not correct. cosign does not evaluate these.
  correct_option: b
  explanation: Correct. The input is the verified in-toto statement.
- id: ats119-final-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Apply a policy to all attestations
  source_readings:
  - sections/section-030/module-01/course-03-checking-attestations-with-a-policy.md
  prompt: An image has an old scan with critical findings and a new clean scan. The
    scan policy denies critical findings. What does `verify-attestation --type vuln
    --policy` do?
  options:
  - id: a
    text: It passes, because the newest attestation wins.
    explanation: Not correct. cosign does not rank attestations.
  - id: b
    text: It passes, because one passing attestation is enough.
    explanation: Not correct. Every attestation of the type must pass.
  - id: c
    text: It fails, because every attestation of the type must pass and the old scan
      does not.
    explanation: Correct. cosign does not choose the newest one.
  - id: d
    text: It deletes the old scan and passes.
    explanation: Not correct. cosign never deletes attestations.
  correct_option: c
  explanation: Correct. cosign does not choose the newest one.
- id: ats119-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Handle the password in a pipeline
  source_readings:
  - sections/section-040/module-01/course-01-key-files-passwords-and-imported-keys.md
  prompt: How should a pipeline give cosign the key password?
  options:
  - id: a
    text: From the pipeline secret store into the `COSIGN_PASSWORD` environment variable.
    explanation: Correct. The password never belongs in a script or a repository.
  - id: b
    text: As a line in the script, next to the key.
    explanation: Not correct. That puts the password where the key is.
  - id: c
    text: In the file name of the key.
    explanation: Not correct. File names are not secret.
  - id: d
    text: In the `optional` part of the payload.
    explanation: Not correct. That would publish it.
  correct_option: a
  explanation: Correct. The password never belongs in a script or a repository.
- id: ats119-final-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Define a KMS key
  source_readings:
  - sections/section-040/module-01/course-02-keys-in-a-key-management-service.md
  prompt: What is the main benefit of a key in a key management service (KMS)?
  options:
  - id: a
    text: The key can be copied to any laptop.
    explanation: Not correct. Not copying it is the point.
  - id: b
    text: Signatures are no longer needed.
    explanation: Not correct. The KMS still produces signatures.
  - id: c
    text: Verifiers need a KMS token.
    explanation: Not correct. Verifiers only need the public key.
  - id: d
    text: The private key is created inside the service and never leaves it. The signer
      asks the service to sign.
    explanation: Correct. There is no key file to copy.
  correct_option: d
  explanation: Correct. There is no key file to copy.
- id: ats119-final-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Plan a scheduled rotation
  source_readings:
  - sections/section-040/module-01/course-03-rotating-keys-and-the-signed-payload.md
  prompt: Which steps fit a scheduled key rotation in this module?
  options:
  - id: a
    text: Sign supported releases with the new key, keep the old signatures, skip
      end-of-life releases and publish both public keys.
    explanation: Correct. Users who trust only the old key keep working.
  - id: b
    text: Delete the old signatures first, then sign.
    explanation: Not correct. Users who have not updated would start failing.
  - id: c
    text: Re-sign every release, including end-of-life ones.
    explanation: Not correct. The new key should not vouch for them.
  - id: d
    text: Publish only the new public key.
    explanation: Not correct. Users still need the old one during the change.
  correct_option: a
  explanation: Correct. Users who trust only the old key keep working.
- id: ats119-final-d010-q1
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what an annotation does
  source_readings:
  - sections/section-010/module-02/course-01-annotations-in-the-signed-payload.md
  prompt: Where does cosign put an annotation given with `-a env=production`?
  options:
  - id: a
    text: Into the payload that is signed, under `optional`.
    explanation: Correct. The signature covers the annotation, so it cannot be changed
      afterwards.
  - id: b
    text: Into a file next to the key.
    explanation: Not correct. Check the reading for this topic.
  - id: c
    text: Into the image layers.
    explanation: Not correct. Check the reading for this topic.
  - id: d
    text: Into the registry tag name.
    explanation: Not correct. Check the reading for this topic.
  correct_option: a
  explanation: Correct. The signature covers the annotation, so it cannot be changed
    afterwards.
- id: ats119-final-d010-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Troubleshoot a failure
  source_readings:
  - sections/section-010/module-01/course-04-troubleshooting-signing-and-verification.md
  prompt: "`cosign verify` fails for the release key. What is the first check to tell
    an unsigned image from a signature by another key?"
  options:
  - id: a
    text: Reinstall cosign.
    explanation: Not correct. Check the reading for this topic.
  - id: b
    text: Delete the tag and push again.
    explanation: Not correct. Check the reading for this topic.
  - id: c
    text: Change `COSIGN_PASSWORD`.
    explanation: Not correct. Check the reading for this topic.
  - id: d
    text: Run `cosign tree` on the digest and look at the signatures listed.
    explanation: Correct. The tree shows whether signatures exist at all.
  correct_option: d
  explanation: Correct. The tree shows whether signatures exist at all.
- id: ats119-final-d020-q1
  type: single_choice
  difficulty: beginner
  learning_objective: Know what a bundle holds
  source_readings:
  - sections/section-020/module-02/course-01-what-is-inside-a-bundle.md
  prompt: What does a Sigstore bundle for a blob hold?
  options:
  - id: a
    text: The private key.
    explanation: Not correct. Check the reading for this topic.
  - id: b
    text: The signature and the verification material in one file.
    explanation: Correct. The verifier needs only the file, the bundle and the public
      key.
  - id: c
    text: The whole signed file.
    explanation: Not correct. Check the reading for this topic.
  - id: d
    text: The registry credentials.
    explanation: Not correct. Check the reading for this topic.
  correct_option: b
  explanation: Correct. The verifier needs only the file, the bundle and the public
    key.
- id: ats119-final-d020-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Distribute the key
  source_readings:
  - sections/section-020/module-01/course-03-getting-the-public-key-to-consumers.md
  prompt: What gives consumers trust in a public key?
  options:
  - id: a
    text: A second channel, such as a published hash, apart from the download.
    explanation: Correct. Whoever can replace the file can replace the key on the
      same page.
  - id: b
    text: Placing it on the download page only.
    explanation: Not correct. Check the reading for this topic.
  - id: c
    text: Signing it with itself.
    explanation: Not correct. Check the reading for this topic.
  - id: d
    text: Renaming it release.pub.
    explanation: Not correct. Check the reading for this topic.
  correct_option: a
  explanation: Correct. Whoever can replace the file can replace the key on the same
    page.
- id: ats119-final-d030-q1
  type: single_choice
  difficulty: beginner
  learning_objective: Know the SBOM tool
  source_readings:
  - sections/section-030/module-02/course-01-generating-an-sbom-with-syft.md
  prompt: Which command writes an SPDX JSON SBOM for an image in the lab registry?
  options:
  - id: a
    text: "`cosign sbom`."
    explanation: Not correct. Check the reading for this topic.
  - id: b
    text: "`regctl sbom`."
    explanation: Not correct. Check the reading for this topic.
  - id: c
    text: "`syft scan registry:...@digest -o spdx-json=file`."
    explanation: Correct. syft scans the image by digest.
  - id: d
    text: "`docker build --sbom`."
    explanation: Not correct. Check the reading for this topic.
  correct_option: c
  explanation: Correct. syft scans the image by digest.
- id: ats119-final-d030-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Separate roles
  source_readings:
  - sections/section-030/module-01/course-04-building-a-release-gate-from-attestations.md
  prompt: Why should the gate hold only the public key?
  options:
  - id: a
    text: Public keys are faster.
    explanation: Not correct. Check the reading for this topic.
  - id: b
    text: If it could sign, it could make a failing release pass.
    explanation: Correct. Signing stays with the release process.
  - id: c
    text: Private keys expire.
    explanation: Not correct. Check the reading for this topic.
  - id: d
    text: Gates cannot read files.
    explanation: Not correct. Check the reading for this topic.
  correct_option: b
  explanation: Correct. Signing stays with the release process.
- id: ats119-final-d040-q1
  type: single_choice
  difficulty: beginner
  learning_objective: Know import-key-pair
  source_readings:
  - sections/section-040/module-02/course-02-importing-an-existing-pem-key.md
  prompt: Which command turns an existing PEM key into a cosign key pair?
  options:
  - id: a
    text: "`cosign generate-key-pair`."
    explanation: Not correct. Check the reading for this topic.
  - id: b
    text: "`cosign public-key`."
    explanation: Not correct. Check the reading for this topic.
  - id: c
    text: "`cosign tree`."
    explanation: Not correct. Check the reading for this topic.
  - id: d
    text: "`cosign import-key-pair`."
    explanation: Correct. It reads the key and protects it with a password.
  correct_option: d
  explanation: Correct. It reads the key and protects it with a password.
- id: ats119-final-d040-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Avoid key files
  source_readings:
  - sections/section-040/module-03/course-04-controlling-who-may-sign.md
  prompt: What is the benefit of removing the file-based private key after moving
    to KMS?
  options:
  - id: a
    text: Signatures become smaller.
    explanation: Not correct. Check the reading for this topic.
  - id: b
    text: Verification gets faster.
    explanation: Not correct. Check the reading for this topic.
  - id: c
    text: No signing key is left on disk to copy.
    explanation: Correct. Only the KMS can sign.
  - id: d
    text: The public key changes.
    explanation: Not correct. Check the reading for this topic.
  correct_option: c
  explanation: Correct. Only the KMS can sign.
