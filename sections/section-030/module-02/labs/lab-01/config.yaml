# Attach An SBOM And A Review Attestation
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-119-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tools"
      description: "Starts the registry and the workstation with cosign v3.1.4 and syft v1.55.0, and copies the example images"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-119-lab-030-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Registry and workstation (namespaces registry and workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation has its tools and the registry answers"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-sbom-attestation"
      description: "Confirms the 6.15.0 digest has an SPDX JSON attestation signed by the release key"
      type: "file"
      source: "validation/validate-sbom-attestation.sh"
    - name: "validate-review-attestation"
      description: "Confirms the 6.15.0 digest has a review attestation with the inventory predicate type"
      type: "file"
      source: "validation/validate-review-attestation.sh"
    - name: "validate-old-release-clean"
      description: "Confirms 6.14.1 has no SBOM attestation"
      type: "file"
      source: "validation/validate-old-release-clean.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - registry:3.1.2
