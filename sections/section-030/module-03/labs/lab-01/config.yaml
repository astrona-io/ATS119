# Require A Trusted SBOM Tool With A Rego Policy
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-119-lab-030-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tools"
      description: "Starts the registry and the workstation with cosign v3.1.4 and syft v1.55.0, and copies the example images"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-119-lab-030-03-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Registry and workstation (namespaces registry and workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation has its tools and the registry answers"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-policy-written"
      description: "Confirms the policy file exists and uses the signature package"
      type: "file"
      source: "validation/validate-policy-written.sh"
    - name: "validate-policy-passes-current"
      description: "Confirms the policy accepts the SBOM attested on 6.15.0"
      type: "file"
      source: "validation/validate-policy-passes-current.sh"
    - name: "validate-policy-rejects-old"
      description: "Confirms the policy rejects the SBOM attested on 6.14.1"
      type: "file"
      source: "validation/validate-policy-rejects-old.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - registry:3.1.2
