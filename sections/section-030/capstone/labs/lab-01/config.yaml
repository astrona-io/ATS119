# Gate A Release On Its Attestations
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-119-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tools"
      description: "Starts the registry and the workstation with cosign v3.1.4 and syft v1.55.0, and copies the example images"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-119-capstone-030-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Registry and workstation (namespaces registry and workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation has its tools and the registry answers"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-policies-written"
      description: "Confirms both Rego policy files exist in package signature"
      type: "file"
      source: "validation/validate-policies-written.sh"
    - name: "validate-release-passes"
      description: "Confirms 6.15.0 passes both policies"
      type: "file"
      source: "validation/validate-release-passes.sh"
    - name: "validate-policies-reject-old"
      description: "Confirms both policies reject the 6.14.1 attestations"
      type: "file"
      source: "validation/validate-policies-reject-old.sh"
    - name: "validate-reference-policies"
      description: "Confirms 6.15.0 also passes the grader's own policies"
      type: "file"
      source: "validation/validate-reference-policies.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - registry:3.1.2
