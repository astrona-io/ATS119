# Attach Provenance And Vulnerability Attestations
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-119-lab-030-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-tools"
      description: "Starts the registry and the workstation with cosign v3.1.4 and syft v1.55.0, and copies the example images"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-119-lab-030-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Registry and workstation (namespaces registry and workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation has its tools and the registry answers"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-provenance"
      description: "Confirms a SLSA v1 provenance attestation from the release builder verifies"
      type: "file"
      source: "validation/validate-provenance.sh"
    - name: "validate-vuln"
      description: "Confirms a vulnerability attestation from Trivy verifies"
      type: "file"
      source: "validation/validate-vuln.sh"
    - name: "validate-old-release-untouched"
      description: "Confirms 6.14.1 carries no attestation"
      type: "file"
      source: "validation/validate-old-release-untouched.sh"

teardown:
  keepCluster: false
