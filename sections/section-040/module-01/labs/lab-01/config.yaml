# Rotate The Release Signing Key
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-119-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-tools"
      description: "Starts the registry and the workstation with cosign v3.1.4 and syft v1.55.0, and OpenBao 2.7.1 in development mode, and copies the example images"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-119-lab-040-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Registry and workstation (namespaces registry and workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation has its tools and the registry answers"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-new-key"
      description: "Confirms a new key pair release-2026 exists and differs from the old one"
      type: "file"
      source: "validation/validate-new-key.sh"
    - name: "validate-current-release"
      description: "Confirms 6.15.0 verifies with the new key (key=release-2026) and still with the old key"
      type: "file"
      source: "validation/validate-current-release.sh"
    - name: "validate-end-of-life-release"
      description: "Confirms 6.14.1 verifies with the old key only"
      type: "file"
      source: "validation/validate-end-of-life-release.sh"
    - name: "validate-trust-set"
      description: "Confirms /work/keys/trusted holds both public keys"
      type: "file"
      source: "validation/validate-trust-set.sh"

teardown:
  keepCluster: false
