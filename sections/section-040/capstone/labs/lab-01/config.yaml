# Move Release Signing Into OpenBao Transit
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-119-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-tools"
      description: "Starts the registry and the workstation with cosign v3.1.4 and syft v1.55.0, and OpenBao 2.7.1 in development mode, and copies the example images"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-119-capstone-040-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Registry and workstation (namespaces registry and workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation has its tools and the registry answers"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-transit-key"
      description: "Confirms OpenBao Transit holds the key cosign-release"
      type: "file"
      source: "validation/validate-transit-key.sh"
    - name: "validate-exported-key"
      description: "Confirms release-kms.pub is the public key of the Transit key"
      type: "file"
      source: "validation/validate-exported-key.sh"
    - name: "validate-kms-signature"
      description: "Confirms 6.15.0 verifies with release-kms.pub and signer=openbao"
      type: "file"
      source: "validation/validate-kms-signature.sh"
    - name: "validate-no-file-key"
      description: "Confirms the file-based private key was removed"
      type: "file"
      source: "validation/validate-no-file-key.sh"

teardown:
  keepCluster: false
