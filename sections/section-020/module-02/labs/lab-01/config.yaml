# Check Three Downloads Against Their Bundles
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-119-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tools"
      description: "Starts the registry and the workstation with cosign v3.1.4 and syft v1.55.0, and copies the example images"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-119-lab-020-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Registry and workstation (namespaces registry and workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation has its tools and the registry answers"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-verified-list"
      description: "Confirms verified.txt lists exactly the downloads that verify with the release key"
      type: "file"
      source: "validation/validate-verified-list.sh"
    - name: "validate-failed-list"
      description: "Confirms failed.txt lists exactly the downloads that do not verify"
      type: "file"
      source: "validation/validate-failed-list.sh"
    - name: "validate-downloads-unchanged"
      description: "Confirms no download and no bundle was changed"
      type: "file"
      source: "validation/validate-downloads-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - registry:3.1.2
